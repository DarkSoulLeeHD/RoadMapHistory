# Deployt roadmap/ (index.html + phases.json + debunks.json) als GitHub Pages.
# Site-Root = Inhalt von roadmap/ → https://<user>.github.io/RoadMapHistory/
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact (roadmap/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: roadmap

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
